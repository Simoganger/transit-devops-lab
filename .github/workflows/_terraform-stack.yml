# Reusable workflow: fmt -> validate -> plan (PR comment) -> apply (main + approval)
# With destroy: true, the plan is a destroy plan (same review + approval gate).
name: _terraform-stack

on:
  workflow_call:
    inputs:
      stack:
        required: true
        type: string
      apply:
        required: true
        type: boolean
      destroy:
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # obtain the GitHub OIDC token for Workload Identity Federation
  pull-requests: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_region: ${{ vars.GCP_REGION }}
  TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_gitops_repo_url: ${{ github.server_url }}/${{ github.repository }}.git

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.stack }}
    outputs:
      has_changes: ${{ steps.plan.outputs.exitcode == '2' }}
    steps:
      - uses: actions/checkout@v4

      - name: GCP authentication (OIDC, keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TF_SA }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: terraform validate
        run: terraform validate

      - name: Static analysis (Checkov)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ inputs.stack }}
          framework: terraform
          soft_fail: true # switch to false once exceptions are documented

      - name: terraform plan
        id: plan
        env:
          DESTROY_FLAG: ${{ inputs.destroy && '-destroy' || '' }}
        run: |
          set +e
          terraform plan ${DESTROY_FLAG} -var-file=env/dev.tfvars -out=tfplan -detailed-exitcode -no-color > plan.txt
          code=$?
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          cat plan.txt
          [ "$code" -eq 1 ] && exit 1 || exit 0

      - name: Comment the plan on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          STACK: ${{ inputs.stack }}
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync(`${process.env.STACK}/plan.txt`, 'utf8');
            const body = `### Terraform plan: \`${process.env.STACK}\`\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan.slice(-60000)}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

      - name: Keep the plan
        if: inputs.apply
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.stack }}
          path: ${{ inputs.stack }}/tfplan
          retention-days: 1

  apply:
    needs: plan
    if: inputs.apply && needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    environment: dev # GitHub protection rule = manual approval
    defaults:
      run:
        working-directory: ${{ inputs.stack }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TF_SA }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.stack }}
          path: ${{ inputs.stack }}

      - run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      # --- Destroy of the platform stack only --------------------------------------
      # The Gateway (and its load balancer, NEGs and use of the static IP) is
      # created by ArgoCD, not Terraform. It must be gone before the infra stack
      # can delete the static IP, the subnet and the VPC.
      - name: "Pre-destroy: read cluster details from the infra state"
        id: cluster
        if: inputs.destroy && inputs.stack == 'platform'
        working-directory: infra
        run: |
          terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" > /dev/null
          echo "name=$(terraform output -raw cluster_name)" >> "$GITHUB_OUTPUT"
          echo "location=$(terraform output -raw cluster_location)" >> "$GITHUB_OUTPUT"
          echo "gateway_ip=$(terraform output -raw gateway_ip)" >> "$GITHUB_OUTPUT"

      - name: "Pre-destroy: cluster credentials (DNS endpoint)"
        if: inputs.destroy && inputs.stack == 'platform'
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ steps.cluster.outputs.name }}
          location: ${{ steps.cluster.outputs.location }}
          use_dns_based_endpoint: true

      - name: "Pre-destroy: setup gcloud"
        if: inputs.destroy && inputs.stack == 'platform'
        uses: google-github-actions/setup-gcloud@v2

      - name: "Pre-destroy: stop ArgoCD and release the Gateway load balancer"
        if: inputs.destroy && inputs.stack == 'platform'
        env:
          CLUSTER: ${{ steps.cluster.outputs.name }}
          LOCATION: ${{ steps.cluster.outputs.location }}
          GATEWAY_IP: ${{ steps.cluster.outputs.gateway_ip }}
        run: |
          set -euo pipefail

          # 1. Stop ArgoCD reconciliation, otherwise selfHeal recreates the Gateway.
          kubectl -n argocd scale statefulset argocd-application-controller --replicas=0 || true

          # 2. Delete the Gateway. The GKE controller removes the load balancer
          #    (forwarding rule, proxy, URL map, backend service) before it
          #    releases the Gateway finalizer, so --wait covers that work.
          kubectl -n transit delete gateway transit-gateway --ignore-not-found --wait=true --timeout=15m

          # 3. Wait until no forwarding rule uses the static IP any more.
          for i in $(seq 1 45); do
            fr=$(gcloud compute forwarding-rules list --global --filter="IPAddress=$GATEWAY_IP" --format='value(name)' | wc -l)
            echo "attempt $i: forwarding rules on $GATEWAY_IP: $fr"
            if [ "$fr" -eq 0 ]; then exit 0; fi
            sleep 20
          done
          echo "::error::Forwarding rule still uses $GATEWAY_IP after 15 minutes"
          exit 1

      # Apply EXACTLY the approved plan (no re-plan).
      - run: terraform apply -auto-approve tfplan

      # The NEGs of the vehicle-api Service are deleted by the GKE NEG
      # controller once the namespace is gone. They live in the GKE subnet,
      # so the infra destroy would fail while they still exist.
      - name: "Post-destroy: wait for the NEGs to be deleted"
        if: inputs.destroy && inputs.stack == 'platform'
        env:
          CLUSTER: ${{ steps.cluster.outputs.name }}
          LOCATION: ${{ steps.cluster.outputs.location }}
        run: |
          set -euo pipefail
          VPC=$(gcloud container clusters describe "$CLUSTER" --location "$LOCATION" --format='value(network)')
          for i in $(seq 1 45); do
            neg=$(gcloud compute network-endpoint-groups list --filter="network~/${VPC}\$" --format='value(name)' | wc -l)
            echo "attempt $i: NEGs in $VPC: $neg"
            if [ "$neg" -eq 0 ]; then exit 0; fi
            sleep 20
          done
          echo "::error::NEGs still present in $VPC after 15 minutes"
          exit 1
