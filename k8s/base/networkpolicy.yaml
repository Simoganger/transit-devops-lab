# Autopilot uses GKE Dataplane V2: NetworkPolicies are enforced.
# Deny all ingress by default, then allow only the Google load
# balancer (traffic + health checks) to port 8080.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-google-lb-to-api
spec:
  podSelector:
    matchLabels:
      app: vehicle-api
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - ipBlock:
            cidr: 35.191.0.0/16
        - ipBlock:
            cidr: 130.211.0.0/22
      ports:
        - protocol: TCP
          port: 8080
