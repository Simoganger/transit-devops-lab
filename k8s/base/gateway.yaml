# GKE Gateway API -> global external HTTP(S) load balancer (Google Front End)
# Cloud Armor is attached to the backend by GCPBackendPolicy.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: transit-gateway
spec:
  gatewayClassName: gke-l7-global-external-managed
  addresses:
    - type: NamedAddress
      value: transit-lab-gateway-ip # infra/network.tf: google_compute_global_address.gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vehicle-api
spec:
  parentRefs:
    - name: transit-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/
      backendRefs:
        - name: vehicle-api
          port: 80
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: vehicle-api
spec:
  default:
    securityPolicy: transit-lab-edge-policy # infra/armor.tf
    timeoutSec: 30
    logging:
      enabled: true
      sampleRate: 500000 # 50%
  targetRef:
    group: ""
    kind: Service
    name: vehicle-api
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: vehicle-api
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        port: 8080
        requestPath: /healthz
  targetRef:
    group: ""
    kind: Service
    name: vehicle-api
