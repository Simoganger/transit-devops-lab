<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" width="960" height="590" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker></defs>
<rect width="960" height="590" fill="#ffffff"/>
<polygon points="480,14 650,50 480,86 310,50" fill="#f1f3f6" stroke="#5a6577" stroke-width="1.4"/>
<text x="480" y="47" font-size="12.5" font-weight="600" fill="#0b3d63" text-anchor="middle">Can the vendor package</text>
<text x="480" y="63" font-size="12.5" font-weight="600" fill="#0b3d63" text-anchor="middle">run in containers?</text>
<path d="M310,50 L250,50 L250,112" fill="none" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="275" y="43" font-size="11" font-weight="400" fill="#5a6577" text-anchor="middle" font-style="italic">yes</text>
<path d="M650,50 L710,50 L710,112" fill="none" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="685" y="43" font-size="11" font-weight="400" fill="#5a6577" text-anchor="middle" font-style="italic">no</text>
<text x="250" y="130" font-size="11.5" font-weight="700" fill="#2f855a" text-anchor="middle">OPTION A · CONTAINERIZABLE</text>
<rect x="40" y="142" width="420" height="92" rx="7" fill="#fdf3e3" stroke="#b7791f" stroke-width="1.4"/>
<text x="250.0" y="170.25" font-size="13.5" font-weight="600" fill="#0b3d63" text-anchor="middle">GitOps repo “vendor-x”</text>
<text x="250.0" y="185.75" font-size="11.5" font-weight="400" fill="#4a5568" text-anchor="middle">vendor (or in-house) Helm chart</text>
<text x="250.0" y="200.75" font-size="11.5" font-weight="400" fill="#4a5568" text-anchor="middle">values-dev / qa / prod.yaml</text>
<text x="250.0" y="215.75" font-size="11.5" font-weight="400" fill="#4a5568" text-anchor="middle">ExternalSecrets, NetworkPolicies</text>
<path d="M250,234 L250,270" fill="none" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="40" y="270" width="420" height="42" rx="7" fill="#eaf5ee" stroke="#2f855a" stroke-width="1.4"/>
<text x="250.0" y="295.75" font-size="13.5" font-weight="600" fill="#0b3d63" text-anchor="middle">ArgoCD</text>
<path d="M250,312 L250,348" fill="none" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="40" y="348" width="420" height="58" rx="7" fill="#eaf5ee" stroke="#2f855a" stroke-width="1.4"/>
<text x="250.0" y="374.25" font-size="13.5" font-weight="600" fill="#0b3d63" text-anchor="middle">GKE</text>
<text x="250.0" y="389.75" font-size="11.5" font-weight="400" fill="#4a5568" text-anchor="middle">dedicated namespace, quotas, Pod Security Standards</text>
<text x="710" y="130" font-size="11.5" font-weight="700" fill="#b7791f" text-anchor="middle">OPTION B · NOT CONTAINERIZABLE</text>
<rect x="500" y="142" width="420" height="58" rx="7" fill="#fdf3e3" stroke="#b7791f" stroke-width="1.4"/>
<text x="710.0" y="168.25" font-size="13.5" font-weight="600" fill="#0b3d63" text-anchor="middle">Packer: hardened, versioned VM image</text>
<text x="710.0" y="183.75" font-size="11.5" font-weight="400" fill="#4a5568" text-anchor="middle">CIS benchmark, Ops Agent, preinstalled software</text>
<path d="M710,200 L710,226" fill="none" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="500" y="226" width="420" height="58" rx="7" fill="#eaf5ee" stroke="#2f855a" stroke-width="1.4"/>
<text x="710.0" y="252.25" font-size="13.5" font-weight="600" fill="#0b3d63" text-anchor="middle">Terraform: Managed Instance Group</text>
<text x="710.0" y="267.75" font-size="11.5" font-weight="400" fill="#4a5568" text-anchor="middle">template, health check, autohealing, rolling update</text>
<path d="M710,284 L710,310" fill="none" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="500" y="310" width="420" height="54" rx="7" fill="#eaf5ee" stroke="#2f855a" stroke-width="1.4"/>
<text x="710.0" y="334.25" font-size="13.5" font-weight="600" fill="#0b3d63" text-anchor="middle">Ansible / startup script</text>
<text x="710.0" y="349.75" font-size="11.5" font-weight="400" fill="#4a5568" text-anchor="middle">environment-specific configuration</text>
<path d="M710,364 L710,390" fill="none" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="500" y="390" width="420" height="54" rx="7" fill="#eaf5ee" stroke="#2f855a" stroke-width="1.4"/>
<text x="710.0" y="414.25" font-size="13.5" font-weight="600" fill="#0b3d63" text-anchor="middle">Immutable deployment</text>
<text x="710.0" y="429.75" font-size="11.5" font-weight="400" fill="#4a5568" text-anchor="middle">new image = new template = MIG rollout</text>
<path d="M920,417 L940,417 L940,171 L922,171" fill="none" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="952" y="294" font-size="11" fill="#5a6577" font-style="italic" text-anchor="middle" transform="rotate(-90 952 294)">next vendor release</text>
<path d="M250,406 L250,486" fill="none" stroke="#c3ccd8" stroke-width="1.5" stroke-dasharray="5 4"/>
<path d="M710,444 L710,486" fill="none" stroke="#c3ccd8" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="40" y="486" width="880" height="82" rx="7" fill="#e8f1f8" stroke="#0b6fa4" stroke-width="1.4"/>
<text x="480.0" y="516.75" font-size="13.5" font-weight="600" fill="#0b3d63" text-anchor="middle">Platform standards enforced in both cases</text>
<text x="480.0" y="532.25" font-size="11.5" font-weight="400" fill="#4a5568" text-anchor="middle">Workload Identity or least-privilege VM service account · secrets in Secret Manager</text>
<text x="480.0" y="547.25" font-size="11.5" font-weight="400" fill="#4a5568" text-anchor="middle">logs and metrics in Cloud Logging / Monitoring · backups · vulnerability scanning · private network</text>
</svg>
